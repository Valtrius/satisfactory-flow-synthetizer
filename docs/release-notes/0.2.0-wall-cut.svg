<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img">
  <title>Custom solver search wall versus 0.1.0</title>
  <desc>0.2.0 finishes the completed screen 13 to 58 percent faster than 0.1.0. Largest cut is 115 all at 58 percent.</desc>
  <rect width="760" height="420" fill="#ffffff"/>
  <text x="24" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">Custom search wall vs 0.1.0</text>
  <text x="24" y="54" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4b5563">Percent faster on completed jobs. Tiny omitted (11-14 ms). Cyclic 10 both timed out.</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#111827">
    <text x="148" y="94" text-anchor="end">24 optimal</text>
    <rect x="160" y="80" width="218" height="18" fill="#2563eb"/>
    <text x="384" y="94">31%</text>
    <text x="148" y="130" text-anchor="end">24 all</text>
    <rect x="160" y="116" width="310" height="18" fill="#2563eb"/>
    <text x="476" y="130">44%</text>
    <text x="148" y="166" text-anchor="end">65 optimal</text>
    <rect x="160" y="152" width="282" height="18" fill="#2563eb"/>
    <text x="448" y="166">40%</text>
    <text x="148" y="202" text-anchor="end">65 all</text>
    <rect x="160" y="188" width="385" height="18" fill="#2563eb"/>
    <text x="551" y="202">55%</text>
    <text x="148" y="238" text-anchor="end">115 all</text>
    <rect x="160" y="224" width="403" height="18" fill="#1d4ed8"/>
    <text x="569" y="238">58%</text>
    <text x="148" y="274" text-anchor="end">238 optimal</text>
    <rect x="160" y="260" width="210" height="18" fill="#2563eb"/>
    <text x="376" y="274">30%</text>
    <text x="148" y="310" text-anchor="end">258 min-links</text>
    <rect x="160" y="296" width="93" height="18" fill="#2563eb"/>
    <text x="259" y="310">13%</text>
    <text x="148" y="346" text-anchor="end">36 optimal</text>
    <rect x="160" y="332" width="176" height="18" fill="#2563eb"/>
    <text x="342" y="346">25%</text>
  </g>
  <line x1="160" y1="78" x2="160" y2="360" stroke="#d1d5db"/>
  <text x="24" y="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7283">One Windows machine, 16 workers. 115 and 238 are two pairs; the rest are one pair. Bar length 0-70%.</text>
</svg>
