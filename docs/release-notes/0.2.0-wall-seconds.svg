<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img">
  <title>Custom solver search wall seconds versus 0.1.0</title>
  <desc>0.1.0 then 0.2.0 search wall for 115 all, 238 optimal, 258 minimum links, and 36 optimal. 258 remains longest at 180 seconds versus 156 seconds.</desc>
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="24" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">Search wall seconds</text>
  <text x="24" y="54" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4b5563">Gray is 0.1.0, blue is 0.2.0. 258 still dominates the clock.</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6b7283">
    <text x="88" y="302" text-anchor="end">0s</text>
    <text x="88" y="227" text-anchor="end">60s</text>
    <text x="88" y="152" text-anchor="end">120s</text>
    <text x="88" y="77" text-anchor="end">180s</text>
    <line x1="96" y1="298" x2="720" y2="298" stroke="#e5e7eb"/>
    <line x1="96" y1="223" x2="720" y2="223" stroke="#e5e7eb"/>
    <line x1="96" y1="148" x2="720" y2="148" stroke="#e5e7eb"/>
    <line x1="96" y1="73" x2="720" y2="73" stroke="#e5e7eb"/>
  </g>
  <!-- 180s = 225px, baseline y=298. 115: 50.9s=63.6px, 21.6s=27px -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#111827">
    <rect x="140" y="234" width="36" height="64" fill="#6b7280"/>
    <rect x="180" y="271" width="36" height="27" fill="#2563eb"/>
    <text x="178" y="318" text-anchor="middle">115 all</text>
    <text x="158" y="228" text-anchor="middle" font-size="11" fill="#4b5563">50.9</text>
    <text x="198" y="265" text-anchor="middle" font-size="11" fill="#1d4ed8">21.6</text>

    <rect x="300" y="287" width="36" height="11" fill="#6b7280"/>
    <rect x="340" y="291" width="36" height="7" fill="#2563eb"/>
    <text x="338" y="318" text-anchor="middle">238 opt</text>
    <text x="318" y="281" text-anchor="middle" font-size="11" fill="#4b5563">8.6</text>
    <text x="358" y="285" text-anchor="middle" font-size="11" fill="#1d4ed8">6.0</text>

    <rect x="460" y="73" width="36" height="225" fill="#6b7280"/>
    <rect x="500" y="103" width="36" height="195" fill="#2563eb"/>
    <text x="498" y="318" text-anchor="middle">258 min-links</text>
    <text x="478" y="67" text-anchor="middle" font-size="11" fill="#4b5563">180</text>
    <text x="518" y="97" text-anchor="middle" font-size="11" fill="#1d4ed8">156</text>

    <rect x="640" y="279" width="36" height="19" fill="#6b7280"/>
    <rect x="680" y="284" width="36" height="14" fill="#2563eb"/>
    <text x="678" y="318" text-anchor="middle">36 opt</text>
    <text x="658" y="273" text-anchor="middle" font-size="11" fill="#4b5563">15.1</text>
    <text x="698" y="278" text-anchor="middle" font-size="11" fill="#1d4ed8">11.3</text>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
    <rect x="96" y="336" width="12" height="12" fill="#6b7280"/>
    <text x="114" y="346" fill="#111827">0.1.0</text>
    <rect x="168" y="336" width="12" height="12" fill="#2563eb"/>
    <text x="186" y="346" fill="#111827">0.2.0</text>
  </g>
</svg>
