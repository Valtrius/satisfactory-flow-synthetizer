[workspace]
resolver = "3"
members = [
    "crates/solver-api",
    "crates/solver-astra",
    "crates/solver-core",
    "crates/solver-reference",
    "crates/solver-z3",
    "crates/solver-validation",
    "crates/synthetizer-app",
    "src-tauri",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
