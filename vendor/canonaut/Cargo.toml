[package]
edition = "2024"
rust-version = "1.85"
name = "canonaut"
version = "1.0.0"
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Rust port of nauty: graph automorphism groups and canonical labelings"
homepage = "https://github.com/um-univie/canonaut"
documentation = "https://docs.rs/canonaut"
readme = "README.md"
keywords = [
    "graph",
    "canonicalization",
    "isomorphism",
    "automorphism",
    "nauty",
]
categories = [
    "algorithms",
    "science",
    "mathematics",
]
license = "Apache-2.0"
repository = "https://github.com/um-univie/canonaut"

[features]
c-nauty-bench = []

[lib]
name = "canonaut"
path = "src/lib.rs"

[[bin]]
name = "compare_stats"
path = "src/bin/compare_stats.rs"
required-features = ["c-nauty-bench"]

[[bin]]
name = "memcheck"
path = "src/bin/memcheck.rs"

[[bin]]
name = "profile"
path = "src/bin/profile.rs"

[[example]]
name = "logo"
path = "examples/logo.rs"

[[bench]]
name = "bench"
path = "benches/bench.rs"
harness = false
required-features = ["c-nauty-bench"]

[dependencies.rand]
version = "0.9.2"
default-features = false
features = ["small_rng"]

[dev-dependencies.criterion]
version = "0.8.1"

[build-dependencies.cc]
version = "1"

[profile.flamegraph]
debug = 2
inherits = "release"
strip = false

[profile.release]
lto = true
codegen-units = 1
strip = true
