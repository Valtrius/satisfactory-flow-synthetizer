name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # git-cliff needs the previous tags and history.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install dependencies
        run: npm ci

      - name: Validate tag and Tauri version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}"
          $config = Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json
          $tauriVersion = $config.version

          if ($tagVersion -ne $tauriVersion) {
            throw "Tag version $tagVersion does not match tauri.conf.json version $tauriVersion"
          }

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      # Optional user-facing preface, including charts. Commit
      # docs/release-notes/<tag>.md (and any SVG/PNG it links) on the
      # tagged revision. GitHub release bodies need absolute image URLs.
      - name: Prepend version highlights
        shell: pwsh
        run: |
          $highlights = "docs/release-notes/${{ github.ref_name }}.md"
          if (-not (Test-Path -LiteralPath $highlights)) { return }
          $head = Get-Content -LiteralPath $highlights -Raw
          $body = Get-Content -LiteralPath RELEASE_NOTES.md -Raw
          Set-Content -LiteralPath RELEASE_NOTES.md -Encoding utf8 ($head.TrimEnd() + "`n`n" + $body)

      - name: Build Tauri application
        run: npm run tauri build -- --bundles nsis

      - name: Prepare release artifacts
        run: npm run package:release

      - name: Verify packaged solver and notices
        run: npm run verify:release

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "target/release/bundle/distribution/satisfactory-flow-synthetizer_${{ github.ref_name }}_portable.zip" \
            "target/release/bundle/distribution/satisfactory-flow-synthetizer_${{ github.ref_name }}_setup.exe" \
            target/release/bundle/distribution/*.sha256 \
            --title "${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md
