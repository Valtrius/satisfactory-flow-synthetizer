name: CI

on:
  push:
    branches: [develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Frontend tests
        run: npm test

      - name: Frontend typecheck
        run: npm run check

      - name: Frontend build
        run: npm run build -w frontend

      - name: Install cvc5 for exact solver tests
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'cvc5.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'cvc5'
          Invoke-WebRequest 'https://github.com/cvc5/cvc5/releases/download/cvc5-1.3.4/cvc5-Win64-x86_64-static.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '279fe7e95810cfb62433fcfc2932f35325a665f32d3697ff33f75e31d5c6a179') { throw 'cvc5 checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $backend = @(Get-ChildItem -LiteralPath $destination -Recurse -Filter cvc5.exe)
          if ($backend.Count -ne 1) { throw 'Expected one cvc5 executable' }
          "ASTRA_CVC5=$($backend[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $backend[0].FullName --version
          if ($LASTEXITCODE -ne 0) { throw 'cvc5 cannot start' }

      - name: Cargo tests
        run: cargo test --workspace --locked
