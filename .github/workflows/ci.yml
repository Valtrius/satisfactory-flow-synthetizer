name: CI

on:
  push:
    branches: [develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Frontend tests
        run: npm test

      - name: Frontend typecheck
        run: npm run check

      - name: Frontend build
        run: npm run build -w frontend

      - name: Prepare bundled cvc5 and test backend
        shell: pwsh
        run: |
          npm run prepare:cvc5
          if ($LASTEXITCODE -ne 0) { throw 'cvc5 preparation failed' }
          $backend = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/binaries/cvc5-x86_64-pc-windows-msvc.exe'
          "SOLVER_CVC5=$backend" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Cargo tests
        run: cargo test --workspace --locked
