name: Validate

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install dependencies
        run: npm ci

      - name: Release metadata
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG) { python scripts/check-release.py --tag $env:RELEASE_TAG } else { python scripts/check-release.py }

      - name: Release and benchmark tooling tests
        run: python -m unittest discover -s scripts -p "test_*.py"

      - name: Format
        run: npm run format:check

      - name: Frontend tests
        run: npm test

      - name: Frontend typecheck
        run: npm run check

      - name: Build desktop verifier
        run: npm run build:web:verifier

      - name: Desktop frontend build
        run: npm run build -w frontend -- --mode desktop

      - name: Prepare bundled cvc5 and test backend
        shell: pwsh
        run: |
          npm run prepare:cvc5
          if ($LASTEXITCODE -ne 0) { throw 'cvc5 preparation failed' }
          $backend = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/binaries/cvc5-x86_64-pc-windows-msvc.exe'
          "SOLVER_CVC5=$backend" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Cargo tests
        run: cargo test --workspace --locked -- --test-threads=1

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
