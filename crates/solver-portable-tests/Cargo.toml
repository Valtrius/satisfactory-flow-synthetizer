[package]
name = "solver-portable-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
solver-api = { path = "../solver-api" }
solver-validation = { path = "../solver-validation" }
solver-core = { path = "../solver-core", default-features = false }
canonaut = "1.0.0"
serde_json = "1.0"
wasm-bindgen = "=0.2.127"

[dev-dependencies]
solver-reference = { path = "../solver-reference" }
solver-core = { path = "../solver-core", features = ["native-runtime"] }

[lints]
workspace = true
