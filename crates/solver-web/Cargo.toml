[package]
name = "solver-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
solver-api = { path = "../solver-api" }
solver-validation = { path = "../solver-validation", default-features = false }
synthetizer-app = { path = "../synthetizer-app", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"

[lints]
workspace = true
